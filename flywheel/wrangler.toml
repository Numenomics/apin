name = "apin-flywheel"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[vars]
FLYWHEEL_REGISTRATIONS_PER_IP_PER_DAY = "50"

# Workers Free already hard-caps CPU at 10ms/request and fails closed ($0 overage).
# Uncomment only if you ever move to Workers Paid:
# [limits]
# cpu_ms = 10

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "apin-flywheel"
database_id = "d53402a0-da81-4743-9d4f-ac3986741312"
