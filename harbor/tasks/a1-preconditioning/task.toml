version = "1.0"
# The only file carried from the agent container to the separate verifier container,
# re-uploaded at the same path (tests/test.sh --submission).
artifacts = ["/app/autoresearch/lanes/A1/submission.py"]

[metadata]
author_name = "Numenomics/apin"
category = "optimize"
lane = "A1"
difficulty = "medium"
description = "Optimize adapt_metric() preconditioning under fixed HMC judge"
tags = ["mcmc", "optimization", "bayesian", "apin", "A1"]

[agent]
# No practical limit: earlier sweeps lost results to agent timeouts.
timeout_sec = 86400.0
# Only the model provider's API is reachable while the agent works. Harbor adds the
# inference host it can infer from -m; pass --allow-agent-host for others (harbor/README.md).
network_mode = "allowlist"
allowed_hosts = []

[verifier]
timeout_sec = 7200.0
network_mode = "no-network"
# Grade in a fresh container from the same sealed image, so nothing the agent wrote
# outside the submission file (harness/, .venv/) reaches the grader.
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 4096
gpus = 0
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 4096
gpus = 0
# Public only while Harbor installs the agent (npm, nvm); the agent and verifier
# phases above narrow it.
network_mode = "public"
